<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nottia · Logo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; background: #0e1014; color: #e6e9ee; padding: 44px 24px; }
      .wrap { max-width: 960px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p.intro { color: #98a1b0; margin: 0 0 28px; font-size: 14px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a1; margin: 32px 0 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
      .tile { border-radius: 18px; padding: 28px; display: flex; align-items: center; justify-content: center; border: 1px solid #262c37; min-width: 220px; }
      .light { --bg: #f8f7fc; --surface: #ffffff; --line: #e9e5f3; --ink: #211c31; --muted: #6c6580; --accent: #7c5cfc; background: var(--bg); }
      .dark { --bg: #131120; --surface: #1b1828; --line: #2b2740; --ink: #f1eefb; --muted: #a29bc0; --accent: #a78bfa; background: var(--bg); }
      .wordmark { display: inline-flex; align-items: center; gap: 12px; }
      .wordmark .sep { width: 1px; height: 36px; background: var(--line); }
      .wordmark .name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); line-height: 1; }
      .wordmark .tag { font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 4px; }
      .wordmark .dot { color: var(--accent); }
      .sizes .tile { padding: 22px; min-width: 0; flex-direction: column; gap: 10px; }
      .sizes small { color: #8b93a1; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Nottia · Logo</h1>
      <p class="intro">
        Marca adaptada a la paleta Lavanda. Se usa en el header, sidebar, footer, login/registro y como favicon.
      </p>

      <h2>Wordmark (con lema)</h2>
      <div class="row">
        <div class="tile light">
          <span class="wordmark">
            <span data-logo="36"></span>
            <span class="sep"></span>
            <span>
              <span class="name">Nottia</span>
              <div class="tag">Notas <span class="dot">·</span> Recordatorios <span class="dot">·</span> Organización</div>
            </span>
          </span>
        </div>
        <div class="tile dark">
          <span class="wordmark">
            <span data-logo="36"></span>
            <span class="sep"></span>
            <span>
              <span class="name">Nottia</span>
              <div class="tag">Notas <span class="dot">·</span> Recordatorios <span class="dot">·</span> Organización</div>
            </span>
          </span>
        </div>
      </div>

      <h2>Solo la marca</h2>
      <div class="row sizes">
        <div class="tile light"><span data-logo="16"></span><small>16</small></div>
        <div class="tile light"><span data-logo="24"></span><small>24</small></div>
        <div class="tile light"><span data-logo="40"></span><small>40</small></div>
        <div class="tile light"><span data-logo="64"></span><small>64</small></div>
        <div class="tile dark"><span data-logo="64"></span><small>64</small></div>
      </div>
    </div>

    <script>
      const MARK = `
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b6bff" />
              <stop offset="1" stop-color="#6a48f0" />
            </linearGradient>
          </defs>
          <g transform="rotate(-7 30 32)">
            <path d="M22 11h19a7 7 0 0 1 7 7v15L33 50H22a7 7 0 0 1-7-7V18a7 7 0 0 1 7-7Z" fill="url(#lg)" />
            <path d="M48 33v17H33Z" fill="#c6b8ff" />
            <rect x="21" y="20" width="19" height="4" rx="2" fill="#ffffff" />
            <rect x="21" y="28" width="15" height="4" rx="2" fill="#ffffff" opacity="0.85" />
            <rect x="21" y="36" width="11" height="4" rx="2" fill="#ffffff" opacity="0.7" />
            <path d="M38 23a8 8 0 0 1 16 0c0 3 1.6 4.8 1.6 4.8a1.2 1.2 0 0 1-1 1.9H37.4a1.2 1.2 0 0 1-1-1.9c0 0 1.6-1.8 1.6-4.8Z" fill="#b7a1ff" />
            <path d="M43 31a3 3 0 0 0 6 0Z" fill="#b7a1ff" />
          </g>
          <path d="M59 15l3-4" stroke="#8b6bff" stroke-width="3" stroke-linecap="round" />
          <path d="M57 24h4" stroke="#8b6bff" stroke-width="3" stroke-linecap="round" />
        </svg>`

      document.querySelectorAll('[data-logo]').forEach((el) => {
        const size = el.dataset.logo
        el.innerHTML = MARK
        const svg = el.querySelector('svg')
        svg.setAttribute('width', size)
        svg.setAttribute('height', size)
      })
    </script>
  </body>
</html>
